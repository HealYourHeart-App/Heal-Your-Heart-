<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heal Your Heart - แอดมินจัดการเนื้อหา</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="home-container admin-gate-container">

        <div class="admin-gate-logo">
            <img src="photo/logo01.png" alt="Heal Your Heart Logo" class="logo-img">
        </div>

        <main class="admin-main">

            <!-- ================= หน้าจอใส่รหัสผ่าน =================
                 ⚠️ ตั้งใจไม่โชว์เมนู/โครงสร้างเว็บใดๆ ในหน้านี้ก่อนพิสูจน์ตัวตน
                 ให้เห็นแค่โลโก้ + ช่องรหัสผ่าน + ปุ่มกลับหน้าแรกเท่านั้น -->
            <div id="loginGate" class="admin-gate-card">
                <div class="admin-gate-header">
                    <span class="admin-gate-icon">🔒</span>
                    <h2>พื้นที่แอดมิน</h2>
                    <p>กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบจัดการเนื้อหา</p>
                </div>
                <div class="admin-gate-body">
                    <input type="password" id="adminPasswordInput" placeholder="รหัสผ่าน" onkeydown="if (event.key === 'Enter') checkAdminPassword();">
                    <button onclick="checkAdminPassword()" class="btn-solid-pink admin-gate-submit">เข้าสู่ระบบ</button>
                    <p id="loginError" class="error-text"></p>
                    <a href="index.html" class="admin-gate-back">← กลับหน้าแรก</a>
                </div>
            </div>

            <!-- ================= แผงควบคุมหลัก (โผล่หลังใส่รหัสถูก) ================= -->
            <div id="adminPanel" class="admin-card" style="display:none;">

                <div class="admin-toolbar">
                    <h2>จัดการบทความ / วิดีโอ</h2>
                    <div class="admin-toolbar-actions">
                        <div class="admin-test-picker">
                            <select id="adminTestAge" title="เลือกช่วงอายุที่จะใช้ทดสอบ">
                                <option value="under18">ต่ำกว่า 18 ปี</option>
                                <option value="18-24">18 - 24 ปี</option>
                                <option value="25-34" selected>25 - 34 ปี</option>
                                <option value="35-44">35 - 44 ปี</option>
                                <option value="45up">45 ปีขึ้นไป</option>
                            </select>
                            <button onclick="startAdminAssessmentTest()" class="btn-outline-pink" title="ทำแบบประเมินเพื่อทดสอบระบบ โดยไม่ถูกนับรวมในสถิติผู้ใช้งาน">🧪 ทดสอบแบบประเมิน</button>
                        </div>
                        <button onclick="openForm()" class="btn-solid-pink">+ เพิ่มรายการใหม่</button>
                    </div>
                </div>

                <div id="itemsList" class="items-list">
                    <p class="loading-text">กำลังโหลดข้อมูล...</p>
                </div>

                <div class="admin-panel-footer">
                    <a href="index.html" class="btn-outline-pink">← กลับหน้าแรก</a>
                </div>
            </div>

        </main>

    </div>

    <!-- ================= ฟอร์มเพิ่ม/แก้ไข (Modal) =================
         ⚠️ ตั้งใจวางไว้นอก .home-container เพราะ .home-container มี backdrop-filter
         ซึ่งทำให้ position:fixed ของลูกข้างในยึดตำแหน่งตาม .home-container แทนที่จะยึดตาม
         viewport จริง (บั๊ก CSS containing block) ทำให้ modal ไปโผล่ไกลจนต้องเลื่อนจอหา
         ย้ายมาไว้เป็นลูกตรงของ body แทน จะได้ fixed ยึดกับจอจริงๆ -->
    <div id="formModal" class="form-modal-overlay" style="display:none;">
        <div class="form-modal">
            <h3 id="formTitle">เพิ่มรายการใหม่</h3>

            <label>ประเภท</label>
            <select id="f_type">
                <option value="article">บทความสาระความรู้ (article) - หน้า knowledge.html</option>
                <option value="video">วิดีโอ (video) - หน้า knowledge.html</option>
                <option value="activity">กิจกรรมผ่อนคลาย (activity) - หน้า relax.html</option>
                <option value="food">อาหารบำบัด (food) - หน้า relax.html</option>
            </select>


            <label>รูปภาพ (ใส่แค่ชื่อไฟล์ เช่น A11.jpg หรือวาง URL เต็มก็ได้ — ระบบจะไปหาในโฟลเดอร์ย่อยของ photo/ ตาม "ประเภท" ที่เลือกด้านบนให้อัตโนมัติ เช่น เลือก article ต้องวางไฟล์ไว้ที่ photo/articles/, video → photo/videos/, activity → photo/activities/, food → photo/food/)</label>
            <input type="text" id="f_image" placeholder="A11.jpg หรือ https://...">

            <label>ชื่อบทความ/วิดีโอ</label>
            <input type="text" id="f_title" placeholder="ชื่อเรื่อง">

            <label>เนื้อหาย่อย</label>
            <textarea id="f_summary" rows="3" placeholder="สรุปเนื้อหาสั้นๆ"></textarea>

            <label>ป้ายกำกับอ้างอิง (เช่น "อ้างอิงบทความจาก" หรือ "ลิงก์วิดีโอ (Youtube)")</label>
            <input type="text" id="f_reference_label" placeholder="อ้างอิงบทความจาก">

            <label>ข้อความอ้างอิง</label>
            <input type="text" id="f_reference_text" placeholder="เช่น ชื่อแหล่งอ้างอิง หรือ 'คลิกเพื่อรับชม'">

            <label>ลิงก์</label>
            <input type="text" id="f_link" placeholder="https://...">

            <label>ลำดับที่แสดง (ตัวเลข)</label>
            <div style="display:flex;gap:12px;align-items:center;">
                <input type="number" id="f_order" placeholder="เช่น 11">
                <label class="checkbox-label" style="margin:0;">
                    <input type="checkbox" id="f_featured">
                    ⭐ แสดงในแถบเลื่อนหน้าแรก
                </label>
            </div>

            <div class="form-actions">
                <button onclick="closeForm()" class="btn-outline-pink">ยกเลิก</button>
                <button onclick="saveItem()" class="btn-solid-pink">บันทึก</button>
            </div>
            <p id="formError" class="error-text"></p>
        </div>
    </div>

    <script src="js/config.js?v=1"></script>
    <script src="js/admin.js?v=7"></script>
</body>
</html>
